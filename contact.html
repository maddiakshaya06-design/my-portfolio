<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Akshaya through the accessible contact form.">

    <meta name="author"
          content="Akshaya">

    <title>Contact | Akshaya</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Contact Me</h1>

        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </nav>
    </header>

    <main>

        <section aria-labelledby="contact-heading">

            <h2 id="contact-heading">
                Get In Touch
            </h2>

            <p>
                If you would like to contact me, please use
                the form below.
            </p>

            <form action="https://formspree.io/f/maenaqyl" method="POST">

                <div>
                    <label for="name">Your Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        autocomplete="name"
                        required>
                </div>

                <br>

                <div>
                    <label for="email">Your Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required>
                </div>

                <br>

                <div>
                    <label for="message">Your Message</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required></textarea>
                </div>

                <br>

                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>
            &copy; 2026 Akshaya. All rights reserved.
        </p>
    </footer>

</body>

</html>
